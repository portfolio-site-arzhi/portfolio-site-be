services:
  portfolio_site_be:
    image: ${PORTFOLIO_SITE_BE_IMAGE:-portfolio-site-be:local}
    volumes:
      - ${UPLOADS_PATH:-./uploads}:/usr/src/app/uploads
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-9000}
      TZ: ${TZ:-Asia/Jakarta}
      DATABASE_URL: ${DATABASE_URL_DOCKER:?DATABASE_URL_DOCKER is required}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3100}
      COOKIE_SECRET: ${COOKIE_SECRET:-change_me}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-60}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-900}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      FRONTEND_URL: ${FRONTEND_URL}
      BASEURL: ${BASEURL:-http://localhost:9000}
      LANDING_PAGE_URL: ${LANDING_PAGE_URL}
    ports:
      - "127.0.0.1:${PORT:-9000}:9000"
    networks:
      - global_database_network
      - global_portfolio_site_network

  portfolio_site_be_migrator:
    image: ${PORTFOLIO_SITE_BE_MIGRATOR_IMAGE:-portfolio-site-be-migrator:local}
    profiles:
      - migration
    environment:
      NODE_ENV: production
      TZ: ${TZ:-Asia/Jakarta}
      DATABASE_URL: ${DATABASE_URL_DOCKER:?DATABASE_URL_DOCKER is required}
    networks:
      - global_database_network

networks:
  global_database_network:
    external: true
  global_portfolio_site_network:
    external: true
