name: Backend CI

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: "postgresql://portfolio_site_test:portfolio_site_test@127.0.0.1:5432/portfolio_site_testing?schema=public"
      NODE_ENV: test
      RATE_LIMIT_MAX_REQUESTS: 100000
      RATE_LIMIT_WINDOW_MS: 60000
      SYSTEM_USER_PASSWORD: change_me_system_user_password
      TZ: Asia/Jakarta

    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: portfolio_site_testing
          POSTGRES_USER: portfolio_site_test
          POSTGRES_PASSWORD: portfolio_site_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portfolio_site_test -d portfolio_site_testing"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Run type check
        run: npm run typecheck

      - name: Apply testing migrations
        run: npm exec -- prisma migrate deploy

      - name: Run integration tests
        run: npm exec -- jest --runInBand --testTimeout=30000 --verbose

      - name: Build application
        run: npm run build

  docker:
    name: Backend Docker build
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare Compose environment
        run: cp env.example .env

      - name: Validate production Compose configuration
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet

      - name: Build runtime image
        run: docker build --file docker/Dockerfile --target runtime --tag portfolio-site-be:ci .

      - name: Build migrator image
        run: docker build --file docker/Dockerfile --target migrator --tag portfolio-site-be-migrator:ci .
