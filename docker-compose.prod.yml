services:
  portfolio_site_be:
    image: ${PORTFOLIO_SITE_BE_IMAGE:?PORTFOLIO_SITE_BE_IMAGE is required in production}
    container_name: portfolio_site_be
    restart: always
    volumes:
      - ${UPLOADS_PATH:?UPLOADS_PATH is required in production}:/usr/src/app/uploads
    environment:
      NODE_ENV: production
      COOKIE_SECRET: ${COOKIE_SECRET:?COOKIE_SECRET is required in production}
      TRUST_PROXY: "2"

  portfolio_site_be_migrator:
    image: ${PORTFOLIO_SITE_BE_MIGRATOR_IMAGE:?PORTFOLIO_SITE_BE_MIGRATOR_IMAGE is required in production}
    restart: "no"
